<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT SYRIA</title>

    <!-- ربط مكتبة التلغرام لعمل الـ Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #12131C;
            color: #FFFFFF;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .captcha-card {
            background-color: #1E202F;
            border: 2px solid #2B2E42;
            border-radius: 16px;
            padding: 25px;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .captcha-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #FFC107;
        }

        .captcha-text {
            font-size: 14px;
            color: #B0B3C6;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-captcha {
            background-color: #3B82F6;
            color: white;
        }

        .btn-captcha:hover {
            background-color: #2563EB;
        }

        .btn-enter {
            background-color: #10B981;
            color: white;
        }

        .btn-enter:hover {
            background-color: #059669;
        }

        .error-msg {
            color: #EF4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* واجهة البوت الرئيسية */
        #main-app {
            display: none;
        }
    </style>
</head>
<body>

    <!-- قسم شاشة الكابتشا -->
    <div id="captcha-section" class="captcha-card">
        <div class="captcha-title">🤖 التحقق الأمني</div>
        <div class="captcha-text">يرجى التأكد من أنك لست روبوت عبر الضغط على زر التحقق أولاً لتأكيد جليتك، ثم الضغط على دخول البوت.</div>
        
        <!-- زر التوجه لرابط حل الكابتشا -->
        <a id="captcha-link" href="https://www.profitableratecpmnetwork.com/z1ixvvwn?key=aa801e058907a56eb9750c7b09487ca3
" onclick="onCaptchaClick()">
            ☑️ التحقق من أنك لست روبوت

        <!-- زر الدخول إلى البوت -->
        <button class="btn btn-enter" onclick="verifyAndEnter()">
            🚀 دخول إلى البوت
        </button>

        <div id="error-message" class="error-msg">⚠️ يرجى الضغط على زر التحقق أولاً ثم المحاولة مرة أخرى!</div>
    </div>

    <!-- قسم الواجهة الرئيسية للبوت (تظهر بعد الكابتشا) -->
    <div id="main-app">
        <h1>🇸🇾 أهلاً بك في واجهة BOT SYRIA</h1>
        <p>تم التحقق بنجاح! يمكنك الآن البدء بالعمل داخل الواجهة.</p>
    </div>

    <script>
        // إعلام التلغرام بأن التطبيق جاهز
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // متغير لتتبع ما إذا تم الضغط على زر الكابتشا
        let captchaClicked = false;

        // دالة يتم استدعاؤها عند الضغط على زر رابط الكابتشا
        function onCaptchaClick() {
            captchaClicked = true;
            document.getElementById('error-message').style.display = 'none';
        }

        // دالة التحقق من الوقت والـ 24 ساعة عند تحميل الصفحة
        function check24HourCaptcha() {
            const lastSolvedTime = localStorage.getItem('last_captcha_solved_time');
            const currentTime = new Date().getTime();
            const twentyFourHoursMs = 24 * 60 * 60 * 1000; // 24 ساعة بالمللي ثانية

            // إذا كان قد حلها سابقاً ولم تمضِ 24 ساعة بعد
            if (lastSolvedTime && (currentTime - lastSolvedTime < twentyFourHoursMs)) {
                showMainApp();
            } else {
                showCaptcha();
            }
        }

        // دالة عند الضغط على زر "دخول إلى البوت"
        function verifyAndEnter() {
            if (captchaClicked) {
                // حفظ الوقت الحالي في الذاكرة لتجاهل الكابتشا لمدة 24 ساعة
                localStorage.setItem('last_captcha_solved_time', new Date().getTime());
                showMainApp();
            } else {
                // إظهار رسالة الخطأ إذا لم يضغط على الكابتشا أولاً
                document.getElementById('error-message').style.display = 'block';
            }
        }

        function showMainApp() {
            document.getElementById('captcha-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }

        function showCaptcha() {
            document.getElementById('captcha-section').style.display = 'block';
            document.getElementById('main-app').style.display = 'none';
        }

        // تشغيل التحقق عند بدء تحميل الصفحة
        check24HourCaptcha();
    </script>
</body>
</html>
