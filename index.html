<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOT SYRIA - المستخدم</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #08090c;
            --card-bg: rgba(18, 20, 26, 0.95);
            --gold-primary: #ffb700;
            --gold-secondary: #d4af37;
            --gold-glow: rgba(255, 183, 0, 0.25);
            --text-main: #f8f9fa;
            --text-muted: #9aa0a6;
            --danger: #ff4757;
            --success: #2ed573;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            background: var(--card-bg);
            border-bottom: 1px solid rgba(255, 183, 0, 0.2);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold-primary); background: #222; }
        .user-name { font-weight: 800; font-size: 0.95rem; }
        .user-id { font-size: 0.75rem; color: var(--text-muted); }

        .balance-card {
            background: linear-gradient(135deg, rgba(255, 183, 0, 0.15), rgba(0,0,0,0.6));
            border: 1px solid var(--gold-primary);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin: 16px;
            text-align: center;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .balance-val { font-size: 2.2rem; font-weight: 900; color: var(--gold-primary); margin: 8px 0; }

        .container { padding: 0 16px; }

        .page-panel { display: none; }
        .page-panel.active { display: block; }

        .admin-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 183, 0, 0.15);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
        }

        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 183, 0, 0.3);
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }

        .btn-action:active { transform: scale(0.98); }

        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--card-bg);
            border-top: 1px solid rgba(255, 183, 0, 0.2);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 700;
        }

        .nav-item.active { color: var(--gold-primary); }

        .empty-msg { text-align: center; color: var(--text-muted); padding: 30px 10px; font-size: 0.85rem; }

        .modal-overlay {
            position: fixed;
            top:0; left:0; width:100vw; height:100vh;
            background: rgba(0,0,0,0.85);
            z-index: 10001;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-body { background: #11131a; border: 1px solid var(--gold-primary); border-radius: var(--radius-lg); width: 100%; max-width: 360px; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <header class="header">
        <div class="user-info">
            <div class="user-avatar" id="u-avatar"></div>
            <div>
                <div class="user-name" id="u-name">المستخدم</div>
                <div class="user-id" id="u-id">ID: 000000</div>
            </div>
        </div>
    </header>

    <div class="balance-card">
        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">رصيدك الحالي</div>
        <div class="balance-val" id="u-balance">0 ل.س</div>
    </div>

    <div class="container">

        <!-- PAGE 1: TASKS -->
        <div id="p-tasks" class="page-panel active">
            <div style="font-weight:800; margin-bottom:10px; color:var(--gold-primary);">🎯 المهام المتاحة</div>
            <div id="container-tasks"></div>
        </div>

        <!-- PAGE 2: WITHDRAW -->
        <div id="p-withdraw" class="page-panel">
            <div class="admin-card">
                <div style="font-weight:800; margin-bottom:12px; color:var(--gold-primary);">💰 طلب سحب الأرباح</div>
                <div class="form-group">
                    <label class="form-label">وسيلة السحب</label>
                    <select id="w-method" class="form-select">
                        <option value="Syriatel Cash">سيريتل كاش (Syriatel Cash)</option>
                        <option value="Sham Cash">شام كاش (Sham Cash)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">رقم الحساب / المحفظة</label>
                    <input type="text" id="w-account" class="form-input" placeholder="09xxxxxxxx">
                </div>
                <div class="form-group">
                    <label class="form-label">المبلغ (ل.س)</label>
                    <input type="number" id="w-amount" class="form-input" placeholder="الحد الأدنى 5000">
                </div>
                <button class="btn-action" onclick="submitWithdrawal()">تقديم طلب السحب 🚀</button>
            </div>
            <div style="font-weight:800; margin:15px 0 10px; color:var(--gold-primary);">📋 سجل السحوبات الأخيرة</div>
            <div id="container-user-withdraws"></div>
        </div>

        <!-- PAGE 3: PROMO -->
        <div id="p-promo" class="page-panel">
            <div class="admin-card">
                <div style="font-weight:800; margin-bottom:12px; color:var(--gold-primary);">🎁 تفعيل كود هدايا</div>
                <div class="form-group">
                    <input type="text" id="promo-code-input" class="form-input" placeholder="أدخل كود البرومو هنا..." style="text-transform: uppercase; text-align: center;">
                </div>
                <button class="btn-action" onclick="claimPromoCode()">تفعيل الكود 🎁</button>
            </div>
        </div>

        <!-- PAGE 4: SUPPORT -->
        <div id="p-support" class="page-panel">
            <div class="admin-card">
                <div style="font-weight:800; margin-bottom:12px; color:var(--gold-primary);">💬 مراسلة الدعم الفني</div>
                <div class="form-group">
                    <textarea id="supp-msg" class="form-textarea" rows="4" placeholder="اكتب مشكلتك أو استفسارك هنا..."></textarea>
                </div>
                <button class="btn-action" onclick="submitSupportTicket()">إرسال الرسالة 📩</button>
            </div>
            <div style="font-weight:800; margin:15px 0 10px; color:var(--gold-primary);">📬 التذاكر والردود الحالية</div>
            <div id="container-user-support"></div>
        </div>

    </div>

    <!-- TASK PROOF MODAL -->
    <div class="modal-overlay" id="proof-modal">
        <div class="modal-body">
            <div style="font-weight: 900; color: var(--gold-primary); margin-bottom: 10px;" id="pm-title">تقديم إثبات المهمة</div>
            <input type="hidden" id="pm-task-id">
            <input type="hidden" id="pm-task-title">
            <div class="form-group">
                <textarea id="pm-proof-text" class="form-textarea" rows="3" placeholder="أدخل اليوزر نيم أو تفاصيل التثبيت هنا..."></textarea>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn-action" onclick="sendTaskProof()">إرسال الإثبات 📤</button>
                <button class="btn-action" style="background:#444; color:#fff;" onclick="closeModal('proof-modal')">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- ALERT MODAL -->
    <div class="modal-overlay" id="alert-modal">
        <div class="modal-body">
            <div style="font-weight: 900; color: var(--gold-primary); margin-bottom: 10px;">تنبيه</div>
            <div id="alert-msg" style="font-size: 0.9rem; margin-bottom: 16px;"></div>
            <button class="btn-action" onclick="closeModal('alert-modal')">حسناً 👍</button>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showPage('p-tasks', this)">🎯 المهام</div>
        <div class="nav-item" onclick="showPage('p-withdraw', this)">💰 السحب</div>
        <div class="nav-item" onclick="showPage('p-promo', this)">🎁 البرومو</div>
        <div class="nav-item" onclick="showPage('p-support', this)">💬 الدعم</div>
    </nav>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD4EFPpYoKA0z-Jh5EaT-JmyJP-tAJKP9M",
          authDomain: "bot-syria.firebaseapp.com",
          databaseURL: "https://bot-syria-default-rtdb.firebaseio.com",
          projectId: "bot-syria",
          storageBucket: "bot-syria.firebasestorage.app",
          messagingSenderId: "865938637842",
          appId: "1:865938637842:web:0a6040b189eb34d55084cb"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let tgUser = { id: 12345678, first_name: "مستخدم تجريبي" };
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
            tgUser = window.Telegram.WebApp.initDataUnsafe.user;
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const USER_ID = String(tgUser.id);
        const USER_NAME = (tgUser.first_name + ' ' + (tgUser.last_name || '')).trim();

        document.getElementById('u-name').innerText = USER_NAME;
        document.getElementById('u-id').innerText = `ID: ${USER_ID}`;

        function showAlert(msg) {
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('alert-modal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showPage(pageId, btn) {
            document.querySelectorAll('.page-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
        }

        // 1. Sync User Profile
        function initUserData() {
            const userRef = db.collection('users').doc(USER_ID);
            userRef.onSnapshot(doc => {
                if (!doc.exists) {
                    userRef.set({
                        userId: USER_ID,
                        name: USER_NAME,
                        balance: 0,
                        completedTasks: [],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    const u = doc.data();
                    document.getElementById('u-balance').innerText = `${(u.balance || 0).toLocaleString()} ل.س`;
                    loadAvailableTasks(u.completedTasks || []);
                }
            });
        }

        // 2. Load Tasks
        function loadAvailableTasks(completedTasks) {
            db.collection('tasks').onSnapshot(snap => {
                const box = document.getElementById('container-tasks');
                box.innerHTML = '';
                let count = 0;

                snap.forEach(doc => {
                    const t = doc.data();
                    if (!completedTasks.includes(doc.id) && t.claimedSeats < t.totalSeats) {
                        count++;
                        box.innerHTML += `
                            <div class="admin-card">
                                <div style="font-weight:900; color:var(--gold-primary);">${t.title}</div>
                                <div style="font-size:0.85rem; color:var(--text-muted); margin:4px 0;">المكافأة: ${t.reward.toLocaleString()} ل.س</div>
                                <div style="display:flex; gap:8px; margin-top:10px;">
                                    <a href="${t.link}" target="_blank" class="btn-action" style="text-align:center; text-decoration:none; background:#333; color:#fff;">انتقال للمهمة 🔗</a>
                                    <button class="btn-action" onclick="openProofModal('${doc.id}', '${t.title}')">تأكيد الإثبات 📤</button>
                                </div>
                            </div>
                        `;
                    }
                });

                if (count === 0) {
                    box.innerHTML = '<div class="empty-msg">لا توجد مهام متاحة حالياً، عد لاحقاً 🎉</div>';
                }
            });
        }

        function openProofModal(taskId, taskTitle) {
            document.getElementById('pm-task-id').value = taskId;
            document.getElementById('pm-task-title').value = taskTitle;
            document.getElementById('pm-proof-text').value = '';
            document.getElementById('proof-modal').classList.add('active');
        }

        async function sendTaskProof() {
            const taskId = document.getElementById('pm-task-id').value;
            const taskTitle = document.getElementById('pm-task-title').value;
            const text = document.getElementById('pm-proof-text').value.trim();

            if (!text) return showAlert('يرجى كتابة نص الإثبات!');

            try {
                await db.collection('admin_proofs').add({
                    userId: USER_ID,
                    userName: USER_NAME,
                    taskId: taskId,
                    taskTitle: taskTitle,
                    proofText: text,
                    status: 'pending',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                closeModal('proof-modal');
                document.getElementById('pm-proof-text').value = ''; // تفريغ
                showAlert('تم إرسال الإثبات للإدارة بنجاح ✅');
            } catch (e) {
                showAlert('فشل إرسال الإثبات: ' + e);
            }
        }

        // 3. Withdrawals Logic
        async function submitWithdrawal() {
            const method = document.getElementById('w-method').value;
            const account = document.getElementById('w-account').value.trim();
            const amount = parseInt(document.getElementById('w-amount').value);

            if (!account || isNaN(amount) || amount <= 0) return showAlert('يرجى إدخال كافة البيانات بشكل صحيح!');

            try {
                const cfgDoc = await db.collection('system_config').doc('main').get();
                const minW = cfgDoc.exists ? (cfgDoc.data().minWithdraw || 5000) : 5000;

                if (amount < minW) return showAlert(`الحد الأدنى للسحب هو ${minW.toLocaleString()} ل.س`);

                const userRef = db.collection('users').doc(USER_ID);
                await db.runTransaction(async (tr) => {
                    const uDoc = await tr.get(userRef);
                    const bal = uDoc.data().balance || 0;
                    if (bal < amount) throw "رصيدك غير كافٍ إجراء طلب السحب!";

                    tr.update(userRef, { balance: bal - amount });
                    tr.set(db.collection('admin_withdrawals').doc(), {
                        userId: USER_ID,
                        userName: USER_NAME,
                        method: method,
                        account: account,
                        amount: amount,
                        status: 'pending',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });

                // تفريغ الحقول
                document.getElementById('w-account').value = '';
                document.getElementById('w-amount').value = '';
                showAlert('تم تقديم طلب السحب بنجاح وخصم الرصيد مؤقتاً ✅');
            } catch (e) {
                showAlert('فشل الطلب: ' + e);
            }
        }

        function loadUserWithdrawals() {
            db.collection('admin_withdrawals').where('userId', '==', USER_ID).onSnapshot(snap => {
                const box = document.getElementById('container-user-withdraws');
                box.innerHTML = '';
                if (snap.empty) return box.innerHTML = '<div class="empty-msg">لا توجد طلبات سحب قيد الانتظار</div>';

                snap.forEach(doc => {
                    const w = doc.data();
                    let st = w.status === 'pending' ? '⏳ قيد الانتظار' : (w.status === 'approved' ? '✅ تم التحويل' : '❌ ملقى');
                    box.innerHTML += `
                        <div class="admin-card" style="font-size:0.85rem;">
                            <div style="font-weight:800; color:var(--gold-primary);">${w.amount.toLocaleString()} ل.س (${w.method})</div>
                            <div style="color:var(--text-muted); margin-top:4px;">الحساب: ${w.account} | الحالة: ${st}</div>
                        </div>
                    `;
                });
            });
        }

        // 4. Support Logic
        async function submitSupportTicket() {
            const msg = document.getElementById('supp-msg').value.trim();
            if (!msg) return showAlert('يرجى كتابة نص الشكوى أولاً!');

            try {
                await db.collection('admin_support').add({
                    userId: USER_ID,
                    userName: USER_NAME,
                    message: msg,
                    reply: '',
                    status: 'open',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('supp-msg').value = ''; // تفريغ
                showAlert('تم إرسال الرسالة إلى الدعم الفني بنجاح ✅');
            } catch (e) {
                showAlert('فشل الإرسال: ' + e);
            }
        }

        function loadUserSupport() {
            db.collection('admin_support').where('userId', '==', USER_ID).onSnapshot(snap => {
                const box = document.getElementById('container-user-support');
                box.innerHTML = '';
                if (snap.empty) return box.innerHTML = '<div class="empty-msg">لا توجد تذاكر دعم سابقة</div>';

                snap.forEach(doc => {
                    const s = doc.data();
                    box.innerHTML += `
                        <div class="admin-card">
                            <div style="font-size:0.85rem; font-weight:700;">سؤالك: ${s.message}</div>
                            <div style="font-size:0.8rem; color:var(--gold-primary); margin-top:6px; background:rgba(0,0,0,0.3); padding:8px; border-radius:8px;">
                                ${s.reply ? 'رد الإدارة: ' + s.reply : '⏳ بانتظار رد الإدارة...'}
                            </div>
                        </div>
                    `;
                });
            });
        }

        // 5. Promo Claim Logic
        async function claimPromoCode() {
            const code = document.getElementById('promo-code-input').value.trim().toUpperCase();
            if (!code) return showAlert('أدخل كود البرومو أولاً!');

            try {
                const promoRef = db.collection('promo_codes').doc(code);
                await db.runTransaction(async (tr) => {
                    const pDoc = await tr.get(promoRef);
                    if (!pDoc.exists) throw "الكود المدخل غير صحيح!";
                    const p = pDoc.data();

                    if (p.status !== 'active' || p.usedCount >= p.maxUses) throw "الكود غير فعال أو انتهت استخداماته!";
                    const usedBy = p.usedBy || [];
                    if (usedBy.includes(USER_ID)) throw "لقد قمت باستخدام هذا البرومو كود من قبل!";

                    const userRef = db.collection('users').doc(USER_ID);
                    const uDoc = await tr.get(userRef);

                    tr.update(userRef, { balance: (uDoc.data().balance || 0) + p.reward });
                    tr.update(promoRef, {
                        usedCount: p.usedCount + 1,
                        usedBy: firebase.firestore.FieldValue.arrayUnion(USER_ID)
                    });
                });

                document.getElementById('promo-code-input').value = ''; // تفريغ
                showAlert('تم تفعيل الكود وإضافة المكافأة لرصيدك بنجاح 🎁');
            } catch (e) {
                showAlert('فشل التفعيل: ' + e);
            }
        }

        // Start Up
        initUserData();
        loadUserWithdrawals();
        loadUserSupport();
    </script>
</body>
</html>
