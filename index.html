<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT SYRIA - Mini App</title>

    <!-- مكتبة التلغرام الرسمية للـ Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #38bdf8; /* لون المربع المحدد */
            --primary-btn: #2563eb;
            --success-btn: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
            box-sizing: border-box;
        }

        /* المربع المحدد بوضوح للكابتشا */
        .captcha-box {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color); /* إطار المربع المحدد */
            border-radius: 20px;
            padding: 25px 20px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.25);
            box-sizing: border-box;
        }

        .captcha-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .captcha-title {
            font-size: 22px;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 12px;
        }

        .captcha-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* أزرار التحقق والدخول */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 0;
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .btn-verify {
            background-color: var(--primary-btn);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-verify:active {
            transform: scale(0.98);
        }

        .btn-enter {
            background-color: var(--success-btn);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }

        .btn-enter:active {
            transform: scale(0.98);
        }

        /* رسالة التنبيه */
        .error-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            font-size: 13px;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        /* الحاوية الرئيسية للتطبيق بعد التجاوز (جاهزة لتضيف فيها ميزاتك) */
        #main-app {
            display: none;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .app-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- قسم صندوق الكابتشا المحدد -->
    <div id="captcha-section" class="captcha-box">
        <div class="captcha-icon">🤖</div>
        <div class="captcha-title">تأكيد الأمان والتحقق</div>
        <div class="captcha-desc">
            يرجى الضغط على زر التحقق الأزرق أدناه لتأكيد أنك لست روبوت، ثم الضغط على زر دخول التطبيق.
        </div>

        <!-- زر الكابتشا مع رابطك الربحي -->
        <a id="captcha-link" 
           href="https://www.profitableratecpmnetwork.com/z1ixvvwn?key=aa801e058907a56eb9750c7b09487ca3" 
           target="_blank" 
           class="btn btn-verify" 
           onclick="handleCaptchaClick()">
            ☑️ التحقق من أنك لست روبوت
        </a>

        <!-- زر الدخول -->
        <button class="btn btn-enter" onclick="handleEnterApp()">
            🚀 دخول إلى التطبيق
        </button>

        <!-- رسالة التحذير في حال عدم الضغط -->
        <div id="error-message" class="error-box">
            ⚠️ يرجى الضغط على زر التحقق الأزرق أولاً ثم المحاولة!
        </div>
    </div>

    <!-- قسم واجهة التطبيق الرئيسية (جاهز للإضافة والتطوير مستقبلاً) -->
    <div id="main-app">
        <div class="app-card">
            <h2>🇸🇾 مرحباً بك في BOT SYRIA</h2>
            <p style="color: var(--text-muted);">تم التحقق بنجاح! هذه الواجهة جاهزة لإضافة كل الأقسام والخدمات الخاصة ببوتك.</p>
        </div>
    </div>

    <script>
        // تهيئة الـ WebApp داخل التلغرام
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let isCaptchaClicked = false;

        // تسجيل النقر على رابط التحقق
        function handleCaptchaClick() {
            isCaptchaClicked = true;
            document.getElementById('error-message').style.display = 'none';
        }

        // فحص الـ 24 ساعة عند فتح الصفحة
        function checkCaptchaStatus() {
            const lastSolved = localStorage.getItem('bot_syria_captcha_time');
            const now = new Date().getTime();
            const twentyFourHours = 24 * 60 * 60 * 1000; // 24 ساعة بالمللي ثانية

            if (lastSolved && (now - parseInt(lastSolved)) < twentyFourHours) {
                showMainApp();
            } else {
                showCaptchaBox();
            }
        }

        // عند النقر على زر دخول التطبيق
        function handleEnterApp() {
            if (isCaptchaClicked) {
                // حفظ توقيت الدخول لبدء الـ 24 ساعة
                localStorage.setItem('bot_syria_captcha_time', new Date().getTime().toString());
                showMainApp();
            } else {
                document.getElementById('error-message').style.display = 'block';
            }
        }

        function showMainApp() {
            document.getElementById('captcha-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }

        function showCaptchaBox() {
            document.getElementById('captcha-section').style.display = 'block';
            document.getElementById('main-app').style.display = 'none';
        }

        // تشغيل التحقق التلقائي
        checkCaptchaStatus();
    </script>
</body>
</html>
